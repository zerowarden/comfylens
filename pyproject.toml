[project]
name = "comfylens"
version = "0.1.0"
description = "Local, read-only explorer for the generation settings embedded in ComfyUI output images"
readme = "README.md"
authors = [
    { name = "ajw", email = "281508152+zerowarden@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
    "watchfiles>=1.3.0",
    "xxhash>=4.0.1",
]

[project.scripts]
comfylens = "comfylens.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×", "–"]

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
pythonVersion = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["private: runs against local images in tests/fixtures/private (skipped when empty)"]
