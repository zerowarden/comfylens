name: comfylens

services:
  comfylens:
    image: comfylens:local
    build:
      context: .
      target: runtime
    container_name: comfylens
    restart: unless-stopped
    # The entrypoint starts as root only to remove the default route (so the app has no way
    # off the machine) and then setpriv to your user; comfylens itself runs without
    # capabilities. NET_ADMIN is needed just to delete the route in the container's netns.
    cap_add:
      - NET_ADMIN
    entrypoint:
      - sh
      - -c
      - >
        ip -4 route del default 2>/dev/null;
        ip -6 route del default 2>/dev/null;
        exec setpriv --reuid "$$COMFYLENS_UID" --regid "$$COMFYLENS_GID"
        --clear-groups --bounding-set=-net_admin comfylens "$$@"
      - --
    command:
      - serve
      - ${COMFYLENS_LIBRARY}
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --watch
      - --no-open
    environment:
      HOME: /data/home
      XDG_DATA_HOME: /data
      XDG_CACHE_HOME: /cache
      XDG_CONFIG_HOME: /config
      COMFYLENS_UID: ${COMFYLENS_UID:?run through make docker or set COMFYLENS_UID}
      COMFYLENS_GID: ${COMFYLENS_GID:?set COMFYLENS_GID}
    # The app is local-only: its DNS upstream is the host's loopback, where nothing
    # serves, so name lookups die on the machine instead of reaching a resolver.
    dns:
      - 127.0.0.1
    ports:
      - "${COMFYLENS_BIND:-127.0.0.1}:${COMFYLENS_PORT:-80}:8765"
    volumes:
      # Mounted at the path it has on the host, so the UI shows the real directory and host
      # and container runs share one catalog (catalog directories are keyed by that path).
      - "${COMFYLENS_LIBRARY:?run through make docker or set COMFYLENS_LIBRARY}:${COMFYLENS_LIBRARY}"
      - "${COMFYLENS_DATA:?set COMFYLENS_DATA}:/data"
      - "${COMFYLENS_CACHE:?set COMFYLENS_CACHE}:/cache"
      - "${COMFYLENS_CONFIG:?set COMFYLENS_CONFIG}:/config"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/library', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mdns:
    image: comfylens-mdns:local
    build:
      context: .
      target: mdns
    container_name: comfylens-mdns
    restart: unless-stopped
    # No network at all: publishing comfylens.local goes through the mounted DBus socket,
    # so this container never needs a route off the machine.
    network_mode: none
    security_opt:
      - apparmor=unconfined
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
