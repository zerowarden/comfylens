name: comfylens

services:
  comfylens:
    image: comfylens:local
    build:
      context: .
      target: runtime
    container_name: comfylens
    restart: unless-stopped
    user: "${COMFYLENS_UID:?run through make docker or set COMFYLENS_UID}:${COMFYLENS_GID:?set COMFYLENS_GID}"
    command:
      - serve
      - ${COMFYLENS_LIBRARY}
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --watch
      - --no-open
    environment:
      HOME: /data/home
      XDG_DATA_HOME: /data
      XDG_CACHE_HOME: /cache
      XDG_CONFIG_HOME: /config
    ports:
      - "${COMFYLENS_BIND:-127.0.0.1}:${COMFYLENS_PORT:-80}:8765"
    volumes:
      # Mounted at the path it has on the host, so the UI shows the real directory and host
      # and container runs share one catalog (catalog directories are keyed by that path).
      - "${COMFYLENS_LIBRARY:?run through make docker or set COMFYLENS_LIBRARY}:${COMFYLENS_LIBRARY}"
      - "${COMFYLENS_DATA:?set COMFYLENS_DATA}:/data"
      - "${COMFYLENS_CACHE:?set COMFYLENS_CACHE}:/cache"
      - "${COMFYLENS_CONFIG:?set COMFYLENS_CONFIG}:/config"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/library', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  mdns:
    image: comfylens-mdns:local
    build:
      context: .
      target: mdns
    container_name: comfylens-mdns
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor=unconfined
    environment:
      DBUS_SYSTEM_BUS_ADDRESS: unix:path=/run/dbus/system_bus_socket
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
